# Drop-in: dopo ogni avvio/restart di Gunicorn, riavvia nginx Docker così il mount
# del socket Unix punta al file nuovo (evita 502 dopo systemctl restart gesper1).
#
# Il prefisso "+" esegue lo script come root anche se gesper1.service usa User=deploy.
# Il prefisso "-" ignora errori non bloccanti (Gunicorn deve partire comunque).
[Service]
ExecStartPost=-+/usr/local/sbin/gesper1-reload-docker-nginx.sh
