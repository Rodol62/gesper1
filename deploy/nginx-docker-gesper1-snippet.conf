# Snippet GESPER per Nginx Docker sulla VPS (procedura_paghe).
# NON è un vhost autonomo: va incluso in /opt/payroll/procedura_paghe/nginx/nginx.conf
# sul server, dopo i blocchi plaza/pagit.
#
# Contesto (2026-06): le porte 80/443 sono occupate dal container
# procedura_paghe-nginx-1. Senza questo blocco, gesper1.plazapretoria.it
# finisce sul default HTTPS (sito Next.js Plaza Pretoria).
#
# Prerequisiti docker-compose (servizio nginx):
#   - /home/deploy/gesper1/gunicorn.sock:/var/run/gesper1.sock:ro
#   - /home/deploy/gesper1/staticfiles:/var/www/gesper/staticfiles:ro
#   - /var/www/gesper/media:/var/www/gesper/media:ro
#   - /var/www/gesper-app:/var/www/gesper-app:ro
#
# TLS nel volume Docker (rinnovare dopo certbot sul host):
#   install -m644 /etc/letsencrypt/live/gesper1.plazapretoria.it/fullchain.pem \
#     /opt/payroll/procedura_paghe/nginx/ssl/gesper1-fullchain.pem
#   install -m600 /etc/letsencrypt/live/gesper1.plazapretoria.it/privkey.pem \
#     /opt/payroll/procedura_paghe/nginx/ssl/gesper1-privkey.pem
#
# Dopo modifica: cd /opt/payroll/procedura_paghe && docker compose up -d nginx
#                 docker exec procedura_paghe-nginx-1 nginx -t
#                 docker exec procedura_paghe-nginx-1 nginx -s reload
#
# Verifica: curl -sI https://gesper1.plazapretoria.it/  → 302 /accounts/login/
# NON usare proxy_pass TCP verso 127.0.0.1:8001 da Docker: UFW blocca il bridge.

server {
    listen 80;
    server_name gesper1.plazapretoria.it;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name gesper1.plazapretoria.it;

    ssl_certificate     /etc/nginx/ssl/gesper1-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/gesper1-privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100M;
    proxy_read_timeout   900s;
    proxy_send_timeout   900s;

    location /static/ {
        alias /var/www/gesper/staticfiles/;
    }

    location /media/ {
        alias /var/www/gesper/media/;
    }

    location /gesper-app/ {
        alias /var/www/gesper-app/;
        try_files $uri $uri/ /gesper-app/index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass         http://unix:/var/run/gesper1.sock:;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
